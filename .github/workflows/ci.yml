name: CI

# Section 83: fast checks run on every push. Docker-sandbox integration,
# Postgres/Neo4j integration, and any real quantum-hardware jobs are
# intentionally NOT run here - they require services this workflow does
# not provision. The backend test suite runs entirely against local
# SQLite, matching local dev (see docs/architecture/adr).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: Format check (black)
        run: black --check app

      - name: Run tests
        run: pytest -v --tb=short

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc -b

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high
